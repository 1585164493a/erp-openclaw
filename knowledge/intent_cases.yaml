# 意图评测集（intent cases）
#
# 用途：把"意图理解对不对"变成可判定的规格 —— 只要求模型输出意图 JSON，不跑整个 agent。
# 一条 = 问题 + 期望域 + 期望槽位 + 是否该澄清。
#
# 字段：
#   domain: 期望路由到哪个子 Agent；none = 主 Agent 自己处理（问候/通用知识）
#   intent: query（单值查询）/ analysis（多步分析）/ action（写操作）/ clarify（信息不足）/ refuse（不可回答）
#   slots: 期望抽取到的槽位；null 表示该项"应该识别为缺失"
#     time_window  自然语言 -> 具体窗口（如 "2026-11 自然月"）
#     metric       指标名
#     dimension    分组维度（channel / category / supplier / warehouse ...）
#   should_clarify: 是否应当在动手前先向用户澄清（口径/范围缺失时为 true）
#   note: 判定理由（给 review 用）
#
# 标注原则：以 knowledge/metrics.md 的口径为准，**不要拿当前 agent 的行为当标注**。

version: 1
cases:

  # ---------- 域路由：销售 ----------
  - id: I01
    q: "11 月各渠道的销售额占比是多少？"
    domain: sales-analyst
    intent: analysis
    slots: {time_window: "2026-11 自然月", metric: "销售额占比", dimension: channel}
    should_clarify: false
    note: '窗口和维度都明确'

  - id: I02
